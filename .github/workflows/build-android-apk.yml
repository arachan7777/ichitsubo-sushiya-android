name: Android APK を作成

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build-trigger.txt'

permissions:
  contents: write

concurrency:
  group: android-apk-manual
  cancel-in-progress: false

jobs:
  build:
    name: Android アプリのビルドと検証
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ソースコード取得
        uses: actions/checkout@v4
      - name: Java 17 の準備
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: GitHub標準Android SDKを確認
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -n "$SDKMANAGER"
          echo "SDK Manager path: $SDKMANAGER"
          "$SDKMANAGER" --version
      - name: Android SDK 35 の導入
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.7 の準備
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: 基本的なゲーム規則テスト
        shell: bash
        run: |
          mkdir -p .build/test
          javac -encoding UTF-8 -d .build/test \
            app/src/main/java/jp/ichitsubo/sushiya/GameRules.java \
            app/src/main/java/jp/ichitsubo/sushiya/GameState.java \
            app/src/main/java/jp/ichitsubo/sushiya/GameEngine.java \
            test/GameRulesTest.java
          java -cp .build/test GameRulesTest
      - name: 一坪寿司屋のゲーム本編テスト
        shell: bash
        run: |
          mkdir -p .build/worldtest
          javac -encoding UTF-8 -d .build/worldtest \
            app/src/main/java/jp/ichitsubo/sushiya/Catalog.java \
            app/src/main/java/jp/ichitsubo/sushiya/SushiWorld.java \
            test/SushiWorldTest.java
          java -cp .build/worldtest SushiWorldTest
      - name: 仕入れの数量選択が表示されるコード検査
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/java/jp/ichitsubo/sushiya/SushiActivity.java').read_text()
          choice = text.split('private void choosePurchase(int index){',1)[1].split('private void caseDialog(){',1)[0]
          assert '.setItems(options,' in choice, '仕入れ数量の選択肢がない'
          assert '.setMessage(' not in choice, '説明文が選択肢を隠してしまう'
          assert 'int[] qty={10,20,50,100,200};' in choice, '5種類の購入数量がない'
          assert 'openPanel("魚屋");' in choice, '購入後に魚屋へ戻れない'
          print('PASS: 購入数量リストが隠れず表示される画面構成')
          PY
      - name: デバッグ用APKをビルド
        shell: bash
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: APKの生成を確認
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 1
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: APKの署名とアプリ識別子を検査
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 10
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep "package: name='jp.ichitsubo.sushiya.playable032'"
      - name: ブラウザで直接取得できる試遊版を公開
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.2-test app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" \
            --title "一坪寿司屋 v0.3.2（仕入れ数量表示の修正版）" \
            --notes "Android用の試遊版APKです。店内ドット絵・お客の操作・寿司調理などを実装しています。未完成の機能と実機での未確認事項があります。ZIPの解凍は不要です。" \
            --prerelease

      - name: スマホへインストールするAPKを保存
        uses: actions/upload-artifact@v4
        with:
          name: ichitsubo-sushiya-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
