name: Android APK を作成

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-manual
  cancel-in-progress: false

jobs:
  build:
    name: Android アプリのビルドと検証
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ソースコード取得
        uses: actions/checkout@v4
      - name: Java 17 の準備
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: GitHub標準Android SDKを確認
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --version
      - name: Android SDK 35 の導入
        shell: bash
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.7 の準備
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: 基本的なゲーム規則テスト
        shell: bash
        run: |
          mkdir -p .build/test
          javac -encoding UTF-8 -d .build/test \
            app/src/main/java/jp/ichitsubo/sushiya/GameRules.java \
            app/src/main/java/jp/ichitsubo/sushiya/GameState.java \
            app/src/main/java/jp/ichitsubo/sushiya/GameEngine.java \
            test/GameRulesTest.java
          java -cp .build/test GameRulesTest
      - name: デバッグ用APKをビルド
        shell: bash
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: APKの生成を確認
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 1
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: スマホへインストールするAPKを保存
        uses: actions/upload-artifact@v4
        with:
          name: ichitsubo-sushiya-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
